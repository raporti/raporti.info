<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexo.al - Lajmet e fundit nga Shqipëria, Kosova dhe Maqedonia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        
        #news-grid {
            perspective: 1000px;
        }

        .news-card {
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                        box-shadow 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        filter 0.4s, opacity 0.4s;
            will-change: transform, filter, opacity;
            transform-style: preserve-3d;
        }
        
        #news-grid.is-hovered .news-card:not(.is-hovered) {
            filter: blur(3px);
            transform: scale(0.95);
            opacity: 0.7;
        }

        .news-card.is-hovered {
            transform: translateZ(30px) scale(1.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .shqip-tag {
            background-color: #D22F27;
            color: white;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }
        .flash-tag {
            color: #D22F27;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .header-title {
             background: -webkit-linear-gradient(45deg, #D22F27, #333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #error-message {
            display: none;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="app" class="container mx-auto p-4 md:p-6">

        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-5xl md:text-6xl font-bold header-title">Lexo.al</h1>
            <p class="text-gray-600 mt-2">Agregatori i lajmeve më të fundit nga burimet kryesore në Shqipëri, Kosovë dhe Maqedoni.</p>
        </header>

        <!-- Search and Filter -->
        <div class="mb-8 flex flex-col md:flex-row gap-4">
            <input
                type="text"
                id="searchInput"
                onkeyup="filterNews()"
                placeholder="Kërko për lajme..."
                class="w-full px-5 py-3 bg-white border border-gray-200 rounded-full focus:ring-2 focus:ring-red-500 focus:outline-none transition duration-300 shadow-sm"
            >
            <select id="categoryFilter" onchange="filterNews()" class="w-full md:w-1/3 px-5 py-3 bg-white border border-gray-200 rounded-full focus:ring-2 focus:ring-red-500 focus:outline-none transition duration-300 shadow-sm">
                <option value="all">Të gjitha Kategoritë</option>
            </select>
        </div>
        
        <!-- Error Message Box -->
        <div id="error-message">
            <h3 class="font-bold">Problem me Ngarkimin e Lajmeve</h3>
            <p id="error-text"></p>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="text-center py-10">
            <svg class="animate-spin h-8 w-8 text-red-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-2 text-gray-600">Duke ngarkuar lajmet më të fundit...</p>
        </div>

        <!-- News Grid -->
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Live news items will be inserted here by JavaScript -->
        </div>
        
        <!-- No Results Message -->
        <div id="no-results" class="hidden text-center py-10">
            <h3 class="text-2xl font-semibold text-gray-700">Asnjë Rezultat</h3>
            <p class="text-gray-500 mt-2">Provoni të ndryshoni filtrat ose termin e kërkimit.</p>
        </div>
    </div>

    <footer class="text-center p-6 mt-10 bg-gray-800 text-white">
        <p>&copy; 2025 Lexo.al - Të gjitha të drejtat e rezervuara.</p>
    </footer>

    <script>
        // --- CONFIGURATION FOR LIVE NEWS ---
        const newsSources = [
            { name: "Telegrafi", url: 'https://telegrafi.com/rss/' },
            { name: "Koha.net", url: 'https://www.koha.net/feed/' },
            { name: "Top Channel", url: 'https://top-channel.tv/feed/' },
            { name: "BalkanWeb", url: 'https://www.balkanweb.com/feed/' },
            { name: "Alsat", url: 'https://alsat.mk/feed/' },
            { name: "Lajmi.net", url: 'https://lajmi.net/feed/' }
        ];

        const newsGrid = document.getElementById('news-grid');
        const loader = document.getElementById('loader');
        const categoryFilter = document.getElementById('categoryFilter');
        const noResults = document.getElementById('no-results');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        let allNews = [];

        // --- CORE FUNCTIONS ---
        
        async function fetchAllNews() {
            // Using the rss2json API, which is more stable for this purpose.
            const promises = newsSources.map(source => {
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`;
                
                return fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                           throw new Error(`Network response was not ok for ${source.name}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Check if the API call was successful and if there are items.
                        if (data.status === 'ok' && data.items) {
                             return data.items.map(item => ({
                                title: item.title,
                                link: item.link,
                                source: source.name,
                                category: item.categories?.[0] || 'Të përgjithshme',
                                timestamp: item.pubDate,
                            }));
                        } else {
                            // If the API call fails for a source, log it and return an empty array.
                            console.warn(`Could not fetch news from ${source.name}. Status: ${data.status}`);
                            return [];
                        }
                    })
                    .catch(error => {
                        console.error(`Error fetching ${source.name}:`, error);
                        return []; // Return empty array on fetch error to not break the page.
                    });
            });

            const results = await Promise.all(promises);
            const articles = results.flat();
            return articles.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        }


        function timeSince(date) {
            if(!date) return '';
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            if (seconds < 3600) return `<span class="flash-tag">Flash</span>`;
            let interval = Math.floor(seconds / 86400);
            if (interval < 1) return `${Math.floor(seconds / 3600)} orë më parë`;
            if (interval === 1) return "1 ditë më parë";
            if (interval < 30) return `${interval} ditë më parë`;
            interval = Math.floor(seconds / 2592000);
            if(interval === 1) return "1 muaj më parë";
            if (interval < 12) return `${interval} muaj më parë`;
            interval = Math.floor(seconds / 31536000);
            if(interval === 1) return "1 vit më parë";
            return `${interval} vite më parë`;
        }

        function displayNews(newsItems) {
            newsGrid.innerHTML = '';
            noResults.style.display = newsItems.length === 0 ? 'block' : 'none';
            
            newsItems.forEach(item => {
                const cardElement = document.createElement('div');
                cardElement.className = 'news-card bg-white rounded-xl shadow-lg overflow-hidden p-5 flex flex-col justify-between';
                cardElement.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm font-bold text-red-600">${item.source}</span>
                            <span class="text-xs text-gray-500">${timeSince(item.timestamp)}</span>
                        </div>
                        <h3 class="text-lg font-bold text-gray-900 mb-3 hover:text-red-700 transition duration-300">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                        </h3>
                    </div>
                    <div class="mt-4">
                         <span class="shqip-tag">${item.category}</span>
                    </div>
                `;
                newsGrid.appendChild(cardElement);
            });

            addHoverEffects();
        }
        
        function addHoverEffects() {
            const cards = document.querySelectorAll('.news-card');
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    newsGrid.classList.add('is-hovered');
                    card.classList.add('is-hovered');
                });
                card.addEventListener('mouseleave', () => {
                    newsGrid.classList.remove('is-hovered');
                    card.classList.remove('is-hovered');
                });
            });
        }

        function populateCategories() {
            while (categoryFilter.options.length > 1) {
                categoryFilter.remove(1);
            }
            const categories = [...new Set(allNews.map(item => item.category))];
            categories.sort();
            categories.forEach(category => {
                if (category) {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    categoryFilter.appendChild(option);
                }
            });
        }

        function filterNews() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = categoryFilter.value;

            const filteredNews = allNews.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || item.source.toLowerCase().includes(searchTerm);
                const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            displayNews(filteredNews);
        }
        
        function showError(message) {
            loader.style.display = 'none';
            errorText.textContent = message;
            errorMessage.style.display = 'block';
        }

        window.onload = async () => {
            try {
                allNews = await fetchAllNews();
                if (allNews.length === 0) {
                   showError("Asnjë lajm nuk mund të ngarkohej. Kjo mund të ndodhë nëse burimet e lajmeve janë të padisponueshme përkohësisht. Ju lutem provoni përsëri më vonë.");
                   return;
                }
                populateCategories();
                displayNews(allNews);
                loader.style.display = 'none';
            } catch (error) {
                console.error("A critical error occurred:", error);
                showError("Një problem teknik ndodhi gjatë ngarkimit të lajmeve.");
            }
        };
    </script>
</body>
</html>
