<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="POCKET – Your AI-powered crypto assistant with real-time Bitcoin prices and liquidation heatmaps." />
  <title>POCKET – Your Crypto AI Assistant</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#3b82f6', dark: '#2563eb' }
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(180deg, #0f0f17 0%, #1a1a2e 50%, #0f0f17 100%);
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ── Glassmorphic card ── */
    .glass {
      background: rgba(30, 30, 50, 0.50);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    /* ── Subtle glow behind the card ── */
    .card-glow {
      position: relative;
    }
    .card-glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(139,92,246,0.12));
      filter: blur(24px);
      z-index: -1;
    }

    /* ── Carousel dots ── */
    .dot {
      width: 10px; height: 10px;
      border-radius: 9999px;
      display: inline-block;
      transition: background 0.3s;
    }
    .dot-active { background: #ffffff; }
    .dot-inactive { background: rgba(255,255,255,0.25); }

    /* ── Heatmap canvas container ── */
    #heatmap-wrap {
      border-radius: 0.875rem;
      overflow: hidden;
      background: #0d0d1a;
      border: 1px solid rgba(255,255,255,0.06);
    }
    #heatmap-canvas {
      display: block;
      width: 100%;
    }

    /* ── Heatmap axis labels ── */
    .heatmap-label {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.35);
      font-variant-numeric: tabular-nums;
    }

    /* ── Agent circles ── */
    .agent-circle {
      width: 72px; height: 72px;
      border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: default;
    }
    .agent-circle:hover {
      transform: scale(1.12) translateY(-3px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.55);
    }

    /* ── CTA button ── */
    .cta-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transition: filter 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 28px rgba(59,130,246,0.38);
    }
    .cta-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 10px 36px rgba(59,130,246,0.55);
    }
    .cta-btn:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    /* ── Price shake on update ── */
    @keyframes flash-price {
      0%   { opacity: 1; }
      30%  { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .price-flash { animation: flash-price 0.4s ease; }

    /* ── Responsive tweaks ── */
    @media (max-width: 390px) {
      .agent-circle { width: 60px; height: 60px; }
      #price-integer { font-size: 3rem; }
      #price-decimal { font-size: 1.75rem; }
    }
  </style>
</head>

<body class="text-white flex items-center justify-center px-4 py-10 font-sans">

  <main class="max-w-sm w-full mx-auto space-y-8 text-center" role="main">

    <!-- ═══════════════════════════════════════
         Logo + Tagline
    ════════════════════════════════════════ -->
    <header>
      <h1 class="text-7xl font-extrabold tracking-tight leading-none">POCKET</h1>
      <p class="text-base text-gray-400 mt-2 font-medium">Your Crypto AI assistant</p>
    </header>

    <!-- ═══════════════════════════════════════
         Main Glass Card
    ════════════════════════════════════════ -->
    <section
      class="glass rounded-3xl overflow-hidden px-6 pt-8 pb-7 card-glow"
      aria-label="Bitcoin price and market data"
    >

      <!-- ── BTC Price ── -->
      <div class="mb-6" aria-live="polite" aria-atomic="true">
        <div class="flex items-baseline justify-center gap-1 select-none">
          <!-- Bitcoin symbol -->
          <span class="text-orange-400 font-bold" style="font-size:2.5rem; line-height:1; margin-right:2px;" aria-hidden="true">₿</span>
          <span id="price-integer" class="font-bold text-white" style="font-size:3.5rem; line-height:1; letter-spacing:-0.02em;">68,450</span>
          <span id="price-decimal" class="text-orange-400 font-semibold" style="font-size:2rem; line-height:1;">.32</span>
        </div>

        <!-- 24h change -->
        <div id="change-wrap" class="flex items-center justify-center gap-1 mt-2" aria-label="24 hour price change">
          <!-- Arrow icon injected by JS -->
          <svg id="change-arrow" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <span id="price-change" class="font-semibold text-base">2.10%</span>
        </div>
      </div>

      <!-- Carousel dots -->
      <div class="flex justify-center gap-2 mb-8" role="tablist" aria-label="View pages">
        <span class="dot dot-active" role="tab" aria-selected="true" aria-label="Page 1"></span>
        <span class="dot dot-inactive" role="tab" aria-selected="false" aria-label="Page 2"></span>
        <span class="dot dot-inactive" role="tab" aria-selected="false" aria-label="Page 3"></span>
      </div>

      <!-- ── Liquidation Heatmap ── -->
      <div class="mb-8" aria-label="Liquidation heatmap section">
        <div class="flex items-baseline justify-between mb-2 px-1">
          <h2 class="text-sm font-semibold text-white">Liquidation Heatmap <span class="text-gray-400 font-normal">(BTC Perp)</span></h2>
          <span id="heatmap-timestamp" class="text-xs text-gray-500">Live</span>
        </div>

        <!-- Price axis labels (top) -->
        <div id="heatmap-top-labels" class="flex justify-between px-1 mb-1" aria-hidden="true"></div>

        <!-- Canvas -->
        <div id="heatmap-wrap">
          <canvas id="heatmap-canvas" height="220" aria-label="Liquidation heatmap visualization"></canvas>
        </div>

        <!-- Legend -->
        <div class="flex items-center justify-between mt-2 px-1" aria-hidden="true">
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1">
              <span class="inline-block w-3 h-2 rounded-sm" style="background:#ef4444;opacity:0.85;"></span>
              <span class="heatmap-label">Long liq.</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="inline-block w-3 h-2 rounded-sm" style="background:#22c55e;opacity:0.75;"></span>
              <span class="heatmap-label">Short liq.</span>
            </div>
          </div>
          <p class="heatmap-label">Powered by CoinGlass-style data</p>
        </div>
      </div>

      <!-- ── Agents ── -->
      <div class="text-left" aria-label="AI trading agents">
        <h2 class="text-base font-semibold mb-5 flex items-center gap-1">
          Agents
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </h2>

        <div class="grid grid-cols-3 gap-4" role="list">

          <!-- Bitcoin Agent -->
          <article class="flex flex-col items-center gap-2" role="listitem" aria-label="Bitcoin agent: Buy Signal">
            <div class="agent-circle bg-gradient-to-br from-yellow-400 to-amber-600 shadow-lg" aria-hidden="true">
              <!-- Bitcoin ₿ -->
              <svg viewBox="0 0 32 32" width="34" height="34" fill="white" aria-hidden="true">
                <path d="M22.45 13.6c.44-2.96-1.81-4.55-4.89-5.61l1-4-2.44-.61-1 3.9c-.64-.16-1.3-.31-1.95-.46l1-3.93-2.44-.61-1 4c-.53-.12-1.04-.24-1.54-.36l-3.18-.79-.61 2.6s1.81.42 1.77.44c.99.25 1.17.9 1.14 1.42L7.6 17.3c-.04.01-.1.03-.17.06l.17.04-1.6 6.42c-.12.3-.43.75-1.12.58.02.03-1.77-.44-1.77-.44l-1.21 2.79 3 .75c.56.14 1.11.28 1.65.42l-1 4.03 2.44.61 1-4 1.95.5-1 3.99 2.44.61 1-4.01c4.13.78 7.23.47 8.54-3.27.05-.14.1-.28.13-.42.83-2.39.06-4.05-1.77-5.02 1.26-.29 2.21-1.12 2.46-2.84zm-4.4 6.17c-.6 2.4-4.66 1.1-5.98.78l1.07-4.28c1.32.33 5.54.98 4.91 3.5zm.6-6.2c-.55 2.18-3.94 1.07-5.04.8l.97-3.88c1.1.27 4.63.78 4.07 3.08z"/>
              </svg>
            </div>
            <p class="font-semibold text-sm leading-tight text-center">Bitcoin</p>
            <p class="text-green-400 text-xs font-medium">Buy Signal</p>
          </article>

          <!-- Ethereum Agent -->
          <article class="flex flex-col items-center gap-2" role="listitem" aria-label="Ethereum agent: Hold">
            <div class="agent-circle bg-gradient-to-br from-blue-500 to-indigo-700 shadow-lg" aria-hidden="true">
              <!-- Ethereum diamond -->
              <svg viewBox="0 0 32 32" width="32" height="32" fill="white" aria-hidden="true">
                <path d="M16 2L6 16.4 16 21.6 26 16.4 16 2zM6.1 17.6L16 30l9.9-12.4-9.9 5.2-9.9-5.2z" opacity=".9"/>
              </svg>
            </div>
            <p class="font-semibold text-sm leading-tight text-center">Ethereum</p>
            <p class="text-yellow-400 text-xs font-medium">Hold</p>
          </article>

          <!-- Solana Agent -->
          <article class="flex flex-col items-center gap-2" role="listitem" aria-label="Solana agent: Alert">
            <div class="agent-circle bg-gradient-to-br from-purple-500 to-violet-700 shadow-lg" aria-hidden="true">
              <!-- Solana wave -->
              <svg viewBox="0 0 32 32" width="32" height="32" fill="none" aria-hidden="true">
                <path d="M5 21.5h16.5l5.5-5H10.5L5 21.5z" fill="white" opacity=".9"/>
                <path d="M5 16h16.5l5.5-5H10.5L5 16z" fill="white" opacity=".7"/>
                <path d="M5 10.5h16.5l5.5-5H10.5L5 10.5z" fill="white" opacity=".5"/>
              </svg>
            </div>
            <p class="font-semibold text-sm leading-tight text-center">Solana</p>
            <p class="text-red-400 text-xs font-medium">Alert</p>
          </article>

        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         CTA Button
    ════════════════════════════════════════ -->
    <button
      class="cta-btn w-full text-white font-bold py-5 px-8 rounded-full text-lg select-none"
      type="button"
      aria-label="Get started with POCKET"
    >
      Get started
    </button>

    <!-- ═══════════════════════════════════════
         Footer
    ════════════════════════════════════════ -->
    <footer class="pb-4">
      <p class="text-xs text-gray-500">
        By continuing you agree to our
        <a href="#" class="text-gray-300 underline underline-offset-2 hover:text-white transition-colors">Terms &amp; Conditions</a>
      </p>
    </footer>

  </main>

  <!-- ═══════════════════════════════════════
       Scripts
  ════════════════════════════════════════ -->
  <script>
    /* ─────────────────────────────────────────
       1. BTC LIVE PRICE (CoinGecko free API)
    ───────────────────────────────────────── */
    (function initPrice() {
      const priceInt   = document.getElementById('price-integer');
      const priceDec   = document.getElementById('price-decimal');
      const changeEl   = document.getElementById('price-change');
      const arrowEl    = document.getElementById('change-arrow');
      const changeWrap = document.getElementById('change-wrap');

      function setArrowUp() {
        arrowEl.innerHTML = '<path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
        changeWrap.classList.remove('text-red-400');
        changeWrap.classList.add('text-green-400');
      }
      function setArrowDown() {
        arrowEl.innerHTML = '<path d="M12 5v14M19 12l-7 7-7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
        changeWrap.classList.remove('text-green-400');
        changeWrap.classList.add('text-red-400');
      }

      // Start with red (most common at page load)
      setArrowDown();

      async function fetchPrice() {
        try {
          const res  = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true', { cache: 'no-store' });
          const data = await res.json();
          const usd    = data.bitcoin.usd;
          const change = data.bitcoin.usd_24h_change;

          // Split integer / decimal
          const full    = usd.toFixed(2);
          const [intPart, decPart] = full.split('.');
          const formatted = Number(intPart).toLocaleString('en-US');

          // Animate flash
          priceInt.classList.remove('price-flash');
          priceDec.classList.remove('price-flash');
          void priceInt.offsetWidth; // reflow
          priceInt.textContent = formatted;
          priceDec.textContent = '.' + decPart;
          priceInt.classList.add('price-flash');
          priceDec.classList.add('price-flash');

          // Change indicator
          const abs = Math.abs(change).toFixed(2);
          changeEl.textContent = abs + '%';
          change >= 0 ? setArrowUp() : setArrowDown();

        } catch (err) {
          console.warn('Price fetch failed:', err);
        }
      }

      fetchPrice();
      setInterval(fetchPrice, 30_000); // refresh every 30 s
    })();


    /* ─────────────────────────────────────────
       2. LIQUIDATION HEATMAP (canvas, fake data)
         Renders a CoinGlass-style heatmap:
         - X axis = price levels
         - Y axis = time (rows, newer at bottom)
         - Color  = red (long liq), green (short liq), intensity = volume
    ───────────────────────────────────────── */
    (function renderHeatmap() {
      const canvas = document.getElementById('heatmap-canvas');
      const topLabels = document.getElementById('heatmap-top-labels');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      // Dimensions
      const COLS  = 40;   // price buckets
      const ROWS  = 22;   // time slices
      const BASE  = 68400; // approximate BTC price
      const STEP  = 250;   // $ per bucket

      // Current price position (roughly middle)
      const CURR_COL = Math.floor(COLS * 0.55);

      // Generate semi-realistic fake liquidation data
      function gaussian(x, mu, sigma) {
        return Math.exp(-0.5 * Math.pow((x - mu) / sigma, 2));
      }

      // Build volume grid [ROWS][COLS]
      // Longs: clustered below current price (red)
      // Shorts: clustered above current price (green)
      const grid = [];
      const longClusters  = [CURR_COL - 3, CURR_COL - 8, CURR_COL - 15];
      const shortClusters = [CURR_COL + 4, CURR_COL + 10, CURR_COL + 18];

      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          let longVol = 0, shortVol = 0;

          // Long liquidations below current price
          longClusters.forEach(mu => {
            longVol += gaussian(c, mu, 2.5) * (0.5 + Math.random() * 0.7);
          });

          // Short liquidations above current price
          shortClusters.forEach(mu => {
            shortVol += gaussian(c, mu, 2.2) * (0.4 + Math.random() * 0.8);
          });

          // Fade intensity towards top rows (older data)
          const ageFactor = 0.5 + (r / ROWS) * 0.5;
          row.push({
            long:  Math.min(longVol  * ageFactor, 1),
            short: Math.min(shortVol * ageFactor, 1),
          });
        }
        grid.push(row);
      }

      function draw() {
        const W = canvas.offsetWidth  || 340;
        const H = 220;
        canvas.width  = W;
        canvas.height = H;

        const cellW = W / COLS;
        const cellH = H / ROWS;

        ctx.clearRect(0, 0, W, H);

        // Background
        ctx.fillStyle = '#0d0d1a';
        ctx.fillRect(0, 0, W, H);

        // Draw cells
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const { long: lv, short: sv } = grid[r][c];
            const x = c * cellW;
            const y = r * cellH;

            if (lv > 0.05) {
              const alpha = 0.15 + lv * 0.75;
              ctx.fillStyle = `rgba(239,68,68,${alpha.toFixed(2)})`;
              ctx.fillRect(x, y, cellW - 0.5, cellH - 0.5);
            }
            if (sv > 0.05) {
              const alpha = 0.1 + sv * 0.65;
              ctx.fillStyle = `rgba(34,197,94,${alpha.toFixed(2)})`;
              ctx.fillRect(x, y, cellW - 0.5, cellH - 0.5);
            }
          }
        }

        // Current price vertical line
        const lineX = CURR_COL * cellW + cellW / 2;
        ctx.save();
        ctx.strokeStyle = 'rgba(251,191,36,0.85)';
        ctx.lineWidth   = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(lineX, 0);
        ctx.lineTo(lineX, H);
        ctx.stroke();
        ctx.restore();

        // Current price label (top of line)
        ctx.save();
        ctx.fillStyle = 'rgba(251,191,36,0.9)';
        ctx.font = 'bold 9px Inter, sans-serif';
        ctx.textAlign = 'center';
        const priceStr = '$' + BASE.toLocaleString('en-US');
        const labelX = Math.min(Math.max(lineX, 24), W - 24);
        ctx.fillText(priceStr, labelX, 12);
        ctx.restore();

        // Grid row dividers (subtle)
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 0.5;
        for (let r = 1; r < ROWS; r++) {
          ctx.beginPath();
          ctx.moveTo(0, r * cellH);
          ctx.lineTo(W, r * cellH);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Render top price labels
      function renderLabels() {
        topLabels.innerHTML = '';
        const step = Math.floor(COLS / 5);
        for (let i = 0; i <= 5; i++) {
          const col   = i * step;
          const price = BASE + (col - CURR_COL) * STEP;
          const span  = document.createElement('span');
          span.className = 'heatmap-label';
          span.textContent = '$' + Math.round(price / 1000) + 'k';
          topLabels.appendChild(span);
        }
      }

      // Redraw on resize
      const ro = new ResizeObserver(() => draw());
      ro.observe(canvas.parentElement);

      draw();
      renderLabels();

      // Subtle live shimmer: regenerate a few cells every 3 s
      setInterval(() => {
        for (let i = 0; i < 30; i++) {
          const r = Math.floor(Math.random() * ROWS);
          const c = Math.floor(Math.random() * COLS);
          let lv = 0, sv = 0;
          [CURR_COL - 3, CURR_COL - 8, CURR_COL - 15].forEach(mu => {
            lv += gaussian(c, mu, 2.5) * (0.5 + Math.random() * 0.7);
          });
          [CURR_COL + 4, CURR_COL + 10, CURR_COL + 18].forEach(mu => {
            sv += gaussian(c, mu, 2.2) * (0.4 + Math.random() * 0.8);
          });
          const af = 0.5 + (r / ROWS) * 0.5;
          grid[r][c] = { long: Math.min(lv * af, 1), short: Math.min(sv * af, 1) };
        }
        draw();

        // Update timestamp
        const ts = document.getElementById('heatmap-timestamp');
        if (ts) ts.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }, 3000);

    })();
  </script>

</body>
</html>
